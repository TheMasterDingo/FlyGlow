   name: build
   on: workflow_dispatch
   jobs:
     build:
       runs-on: windows-2022
       steps:
         - uses: actions/checkout@v4
         - uses: jurplel/install-qt-action@v4
           with:
             version: '6.10.*'
             arch: win64_msvc2022_64
         - uses: ilammy/msvc-dev-cmd@v1
         - run: |
             cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
             cmake --build build --target FlyGlow
             windeployqt build\FlyGlow.exe
             mkdir out; copy build\FlyGlow.exe out\; xcopy build\*.dll out\; xcopy /E /I build\platforms out\platforms; xcopy /E /I build\styles out\styles; xcopy /E /I build\imageformats out\imageformats; xcopy /E /I build\tls out\tls
           shell: cmd
         - uses: actions/upload-artifact@v4
           with:
             name: FlyGlow
             path: out
